<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAM - Travel Assistant</title>
    <style>
        :root {
            --primary: #0066cc;
            --bg: #f4f6f8;
            --chat-bg: #ffffff;
            --user-msg: #0066cc;
            --bot-msg: #f1f5f9;
            --text-dark: #1e293b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .chat-container {
            width: 100%;
            max-width: 500px;
            height: 600px;
            background: var(--chat-bg);
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .chat-header {
            background: var(--primary);
            color: white;
            padding: 16px;
            text-align: center;
            font-weight: bold;
            font-size: 1.1rem;
        }

        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 0.95rem;
            line-height: 1.4;
        }

        .message.bot {
            background: var(--bot-msg);
            color: var(--text-dark);
            align-self: flex-start;
            border-bottom-left-radius: 2px;
        }

        .message.user {
            background: var(--user-msg);
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 2px;
        }

        .chat-input-area {
            padding: 16px;
            border-top: 1px solid #e2e8f0;
            display: flex;
            gap: 8px;
        }

        .chat-input-area input {
            flex: 1;
            padding: 10px 14px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            outline: none;
            font-size: 0.95rem;
        }

        .chat-input-area button {
            background: var(--primary);
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        .chat-input-area button:disabled {
            background: #94a3b8;
            cursor: not-allowed;
        }

        .landing-link {
            color: #0066cc;
            font-weight: bold;
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="chat-header">
        SAM - Travel Assistant
    </div>
    <div class="chat-messages" id="chatMessages">
        <div class="message bot">
            Ciao! Sono SAM, il tuo assistente di viaggio. Come posso aiutarti oggi a pianificare il tuo itinerario?
        </div>
    </div>
    <div class="chat-input-area">
        <input type="text" id="userInput" placeholder="Scrivi un messaggio..." onkeydown="if(event.key==='Enter') sendMessage()" />
        <button id="sendBtn" onclick="sendMessage()">Invia</button>
    </div>
</div>

<script>
    // 1. Estrazione dinamica dell'ID arrivato da Qualtrics
    const urlParams = new URLSearchParams(window.location.search);
    let sessionId = urlParams.get('session_id') || urlParams.get('uid');

    if (!sessionId) {
        sessionId = 'RESP_' + Math.random().toString(36).substr(2, 9);
    }

    let messageCount = 0;
    const maxMessages = 5;

    // Costruzione dell'URL per la Landing Page sincronizzato con l'ID utente
    const landingUrl = "https://landingpage20.github.io/abruzzo/?session_id=" + encodeURIComponent(sessionId) + "&uid=" + encodeURIComponent(sessionId);

    function appendMessage(sender, text) {
        const messagesContainer = document.getElementById('chatMessages');
        const msgDiv = document.createElement('div');
        msgDiv.className = 'message ' + sender;
        msgDiv.innerHTML = text;
        messagesContainer.appendChild(msgDiv);
        messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }

    function sendMessage() {
        const input = document.getElementById('userInput');
        const text = input.value.trim();
        if (!text) return;

        appendMessage('user', text);
        input.value = '';
        messageCount++;

        if (messageCount >= maxMessages) {
            document.getElementById('userInput').disabled = true;
            document.getElementById('sendBtn').disabled = true;

            setTimeout(() => {
                const finalReply = "Grazie per aver chattato con me! Il tuo codice di verifica per Qualtrics è: <b>CS4685LR</b>.<br><br>" +
                                   "Puoi ora scoprire di più sulla tua destinazione cliccando qui: " +
                                   "<a href='" + landingUrl + "' target='_blank' rel='noopener noreferrer' class='landing-link'>Scopri l'Abruzzo</a>";
                appendMessage('bot', finalReply);
            }, 800);
        } else {
            setTimeout(() => {
                const replies = [
                    "Interessante! L'Abruzzo offre paesaggi mozzafiato tra mare e montagna.",
                    "Ottima scelta. Ci sono molti borghi storici e parchi naturali da esplorare.",
                    "Posso suggerirti ottime esperienze sia sulla Costa dei Trabocchi che sul Gran Sasso.",
                    "Perfetto, sto registrando le tue preferenze per la destinazione."
                ];
                const reply = replies[(messageCount - 1) % replies.length];
                appendMessage('bot', reply);
            }, 800);
        }
    }
</script>

</body>
</html>
